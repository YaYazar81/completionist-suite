# Baut die Windows-Setups aller Programme: CompletionistPDF, -MD, -QR und QR-Online.
#
# Läuft bei jedem Push und von Hand (Actions -> "Setups bauen" -> Run workflow).
# Erst die Tests, dann die Setups; die fertigen *-Setup-<Version>.exe liegen danach
# unter dem Lauf bei "Artifacts" zum Herunterladen (30 Tage).
name: Setups bauen

on:
  push:
  workflow_dispatch:

concurrency:
  group: setups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Wie in README.md: .venv im Projektordner, exakte Versionen aus der Lock-Datei.
      # build_setup.ps1 erwartet genau diese .venv.
      - name: Python-Umgebung
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.lock.txt
          .venv\Scripts\python.exe -m pip install -r QR-Online\requirements.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m pytest tests QR-Online\tests -q -p no:cacheprovider

      - name: Setups CompletionistPDF, -MD, -QR
        run: .\build_setup.ps1 -App all

      - name: Setup QR-Online
        working-directory: QR-Online
        run: .\build_setup.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Setups
          path: |
            dist/*-Setup-*.exe
            QR-Online/dist/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
